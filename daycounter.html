<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOPLEVEL Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Montserrat', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      height: 100vh;
      background: url('/mnt/data/A_website_landing_page_image_for_TOPLEVEL,_a_respo.png') no-repeat center center/cover;
    }

    .left, .right {
      flex: 1 1 50%;
      min-width: 300px;
      padding: 30px;
    }

    .left {
      color: white;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .left h1 {
      font-size: 8vw;
      color: #FFD700;
    }

    .left p {
      font-size: 4vw;
      margin: 20px 0;
    }

    .timer {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 5vw;
      font-weight: bold;
    }

    .right {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .right h2 {
      font-size: 3vw;
      margin-bottom: 20px;
      color: #FFD700;
    }

    .right .motivation {
      font-size: 1.5vw;
      line-height: 2.2vw;
      max-width: 90%;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .left, .right {
        flex: 1 1 100%;
        padding: 20px;
        text-align: center;
      }

      .left h1 {
        font-size: 10vw;
      }

      .left p {
        font-size: 5vw;
      }

      .timer {
        font-size: 6vw;
        justify-content: center;
      }

      .right h2 {
        font-size: 6vw;
      }

      .right .motivation {
        font-size: 4vw;
        line-height: 5.5vw;
        max-width: 100%;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <h1>TOPLEVEL</h1>
      <p>Day to go till HSC starts...</p>
      <div class="timer">
        <div><span id="days">0</span><br>DAYS</div>
        <div><span id="hours">0</span><br>HOURS</div>
        <div><span id="minutes">0</span><br>MINUTES</div>
        <div><span id="seconds">0</span><br>SECONDS</div>
      </div>
    </div>
    <div class="right">
      <h2>STAY STRONG!</h2>
      <div class="motivation">
        <p>Every step you take brings you closer to your dreams.</p>
        <p>Believe in yourself. You've prepared for this.</p>
        <p>The future belongs to those who prepare for it today.</p>
        <p>Your hard work will pay off. Keep going!</p>
      </div>
    </div>
  </div>

  <script>
    const countdown = () => {
      const targetDate = new Date("June 20, 2025 00:00:00").getTime();
      const now = new Date().getTime();
      const distance = targetDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("minutes").innerText = minutes;
      document.getElementById("seconds").innerText = seconds;
    };

    setInterval(countdown, 1000);
  </script>
</body>
</html>
