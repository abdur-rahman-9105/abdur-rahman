<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected - Website Under Construction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h1 {
            font-size: 48px;
            color: #f2b632;
        }
        .form-container {
            margin-top: 20px;
        }
        input[type="password"] {
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            width: 250px;
            margin-bottom: 10px;
            background-color: #333;
            color: white;
        }
        button {
            padding: 10px 20px;
            background-color: #f2b632;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e1a227;
        }
        .message {
            margin-top: 20px;
            font-size: 20px;
            color: #f2b632;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Our Website</h1>
        <p>Please enter the password to proceed.</p>
        <div class="form-container">
            <form id="passwordForm" onsubmit="return checkPassword()">
                <input type="password" id="password" placeholder="Enter Password" required>
                <br>
                <button type="submit">Enter</button>
            </form>
            <p class="message" id="message"></p>
        </div>
    </div>

    <script>
        const correctPassword = "6924ar"; // Replace with your predefined password

        function checkPassword() {
            const enteredPassword = document.getElementById("password").value;
            if (enteredPassword === correctPassword) {
                window.location.href = "underconstruction.html"; // Redirect to the next page
            } else {
                document.getElementById("message").textContent = "Incorrect password, please try again.";
                return false; // Prevent form submission
            }
        }
    </script>

</body>
</html>
