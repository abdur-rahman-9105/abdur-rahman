<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected Page</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .hidden { display: none; }
        .login-container { text-align: center; padding: 50px; }
        .message { font-size: 20px; }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div id="login" class="login-container">
        <h2>Please Enter Password</h2>
        <input type="password" id="password" placeholder="Enter Password" />
        <button onclick="checkPassword()">Submit</button>
        <p class="message" id="message"></p>
    </div>

    <!-- Protected Content -->
    <div id="protected" class="hidden">
        <h1>Welcome to the protected content!</h1>
        <p>This website is under construction, please check back later.</p>
    </div>

    <script>
        // Correct password set here
        const correctPassword = "nahid05"; // Replace with your actual password

        // Function to check the entered password
        function checkPassword() {
            const passwordInput = document.getElementById("password").value;
            const message = document.getElementById("message");

            // Check if password matches
            if (passwordInput === correctPassword) {
                // Hide login form and show protected content
                document.getElementById("login").classList.add("hidden");
                document.getElementById("protected").classList.remove("hidden");
            } else {
                // Show error message if password is incorrect
                message.textContent = "Incorrect password. Please try again.";
                message.style.color = "red";
            }
        }
    </script>
</body>
</html>
